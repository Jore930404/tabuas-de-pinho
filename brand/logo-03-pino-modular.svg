  <text x="600" y="584" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="21" font-weight="bold" letter-spacing="9" fill="#2E6B3A">CARPINTARIA &amp; DESIGN</text>
