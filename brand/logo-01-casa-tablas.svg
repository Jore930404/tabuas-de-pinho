<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Tábuas de Pinho — propuesta 1: Casa y tablas</title>
  <desc id="desc">Techo a dos aguas en verde bosque sobre tres tablas de pino apiladas, con el nombre de la carpintería.</desc>
  <rect width="1200" height="800" fill="#F7F0E2"/>
  <path d="M450 330 L600 190 L750 330" fill="none" stroke="#1F4527" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="435" y="334" width="330" height="46" rx="7" fill="#D9A86C"/>
  <rect x="445" y="386" width="330" height="46" rx="7" fill="#C08552"/>
  <rect x="425" y="438" width="330" height="46" rx="7" fill="#A96B37"/>
  <line x1="282" y1="688" x2="352" y2="688" stroke="#C9A46B" stroke-width="2"/>
  <line x1="848" y1="688" x2="918" y2="688" stroke="#C9A46B" stroke-width="2"/>
  <text x="600" y="645" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="bold" fill="#22301F" letter-spacing="0.5">TÁBUAS DE PINHO</text>
  <text x="600" y="697" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="26" font-weight="bold" letter-spacing="8" fill="#2E6B3A">CARPINTARIA &amp; DESIGN</text>
  <text x="600" y="747" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="23" fill="#7A6548">Naturais, resistentes, feitos para durar.</text>
</svg>
